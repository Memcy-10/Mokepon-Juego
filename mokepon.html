<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokepon</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <section id="seleccionar-mascota">
        <h1 class="titulo">Mokepon</h1>
        <h2 class="subtitulo">Elige tu mascota:</h2>
        
        <div id="contenedor-tarjetas" class="tarjetas">
        </div>
        
        <button id="boton-mascota">Seleccionar</button>
    </section>
    
    <section id="ver-mapa">
        <h2 class="subtitulo">Recorre el mapa con tu Mokepon</h2>
        <canvas id="mapa"></canvas>
        <button class="button" id="boton-arriba" onmouseover="detenermovimiento()" onmousedown="moverarriba()">Arriba</button>
        <div class="botones-abajo">

            <button class="button" onmouseover="detenermovimiento()" onmousedown="moverizquierda()">Izquierda</button>
            <button class="button" onmouseover="detenermovimiento()" onmousedown="moverabajo()">Abajo</button>
            <button class="button" onmouseover="detenermovimiento()" onmousedown="moverderecha()">Derecha</button>
        </div>
    </section>

    <section id="seleccionar-ataque">
        <h1 class="titulo">Mokepon</h1>
        <h2 class="subtitulo">Elige tu ataque:</h2>

        <div class="arena">
            <div class="ataques-jugador">
                <div class="mokepon-combate">
                    <img id="imagen-mascota-jugador" alt="">
                    <p id="mascota-jugador"></p>
                    <p><span id="vida-jugador">0</span></p>
                </div>
                <div id="tarjetas-ataque" class="tarjetas-ataques">
                </div>
            </div>
            <div class="ataques-enemigo">
                <div class="mokepon-combate">
                    <img id="imagen-mascota-rival" alt="">
                    <p id="mascota-rival"></p>
                    <p><span id="vida-rival">0</span> </p>
                </div>
                <div id="mensajes">
                    <p>Mucha suerte</p>
                </div>
                <section id="reiniciar">
                    <button id="boton-reiniciar">Reiniciar</button>
                </section>
            </div>
        </div>
    </section>
    <script src="./js/mokepon.js" defer></script>
</body>
</html>
